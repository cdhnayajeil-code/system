<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>총무 담당자 연락처 · 시스템 접속정보</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --tx:#1f2328; --tx2:#5b6572;
    --acc:#1f5eff; --acc-bg:#eef3ff; --ok:#0a7d4b; --off:#98a2b3;
    --warn:#b54708; --warn-bg:#fff7e6; --lock:#5b3fd6; --lock-bg:#f2effd;
    --sec:#f3f5f8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;letter-spacing:-.02em}
  .meta{color:var(--tx2);font-size:12.5px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0;border-bottom:1px solid var(--line)}
  .tab{padding:9px 18px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;
    cursor:pointer;color:var(--tx2);font-size:13.5px;position:relative;top:1px;background:transparent}
  .tab:hover{background:#eceff3}
  .tab.on{background:var(--card);border-color:var(--line);color:var(--tx);font-weight:600}
  .tab .n{font-size:11.5px;color:var(--off);margin-left:6px}
  .tab.vault.on{color:var(--lock)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
  input[type=search],input[type=password]{padding:10px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);font-size:14px;font-family:inherit}
  input[type=search]{flex:1;min-width:220px}
  input:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
  button{padding:9px 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;
    cursor:pointer;font-family:inherit;font-size:13px;color:var(--tx)}
  button:hover{background:#f0f2f5}
  button.p{background:var(--acc);border-color:var(--acc);color:#fff}
  button.p:hover{filter:brightness(1.08)}
  button.lk{background:var(--lock);border-color:var(--lock);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);
    cursor:pointer;font-size:12.5px;color:var(--tx2)}
  .chip .n{color:var(--off);margin-left:4px;font-size:11.5px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip.on .n{color:rgba(255,255,255,.75)}
  .tablebox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:900px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#fafbfc;font-size:12.5px;color:var(--tx2);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#fafbfd}
  tr.sec td{background:var(--sec);font-weight:600;font-size:12.5px;color:var(--tx);padding:7px 12px}
  tr.sec td .n{color:var(--tx2);font-weight:400;margin-left:6px}
  tr.sec:hover td{background:var(--sec)}
  .cat{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--acc-bg);
    color:var(--acc);font-size:12px;white-space:nowrap}
  .co{font-weight:600}
  .tel{color:var(--tx);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tel:hover{color:var(--acc);text-decoration:underline}
  .tel.of{color:var(--tx2);font-size:12.5px}
  a.mail{color:var(--tx2);text-decoration:none;font-size:12.5px;word-break:break-all}
  a.mail:hover{color:var(--acc);text-decoration:underline}
  .sub{color:var(--tx2);font-size:12.5px;word-break:break-word}
  .pos{color:var(--tx2);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--tx2)}
  footer{margin-top:16px;color:var(--tx2);font-size:12px;line-height:1.8}
  code{background:#eceff3;padding:1px 5px;border-radius:4px;font-size:12px}

  /* 금고 */
  .gate{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px 28px;text-align:center}
  .gate h2{margin:0 0 6px;font-size:17px}
  .gate p{margin:0 0 20px;color:var(--tx2);font-size:13px}
  .gate .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .gate input{min-width:240px}
  .err{color:#b42318;font-size:13px;margin-top:12px;min-height:18px}
  .lockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--lock-bg);
    border:1px solid #ddd6fb;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:12.5px;color:#4c34bf}
  .pw{font-family:Consolas,"D2Coding",monospace;font-size:13.5px;letter-spacing:.02em;word-break:break-all}
  .pw.hide{color:transparent;text-shadow:0 0 7px rgba(31,35,40,.75);user-select:none}
  .mini{padding:2px 7px;font-size:11.5px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .mini.dgr{color:#b42318;border-color:#f2c9c5}
  .mini.dgr:hover{background:#fdeceb}
  .warnbox{background:var(--warn-bg);border:1px solid #f5d9a8;color:var(--warn);
    border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px}
  /* 정기업무 · 인증서 일정 */
  .schedbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:12.5px;color:var(--tx2)}
  .schedbar.dirty{background:var(--warn-bg);border-color:#f5d9a8;color:var(--warn)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
  .stat .k{display:block;font-size:11.5px;color:var(--off)}
  .stat b{display:block;font-size:21px;line-height:1.25;letter-spacing:-.02em;margin:1px 0}
  .stat .s{display:block;font-size:11.5px;color:var(--tx2);min-height:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.bad b{color:#b42318}  .stat.warn b{color:var(--warn)}
  .stat.ok b{color:var(--ok)} .stat.mut b{color:var(--off)}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start;margin-bottom:12px}
  .cols>.calwrap,.side>.daybox{margin-bottom:0}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0}
  @media(max-width:1020px){.cols{grid-template-columns:1fr}}
  .urow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .urow:last-child{border-bottom:0;padding-bottom:0}
  .urow .dot{margin-top:6px;flex:none}
  .ub{min-width:0;flex:1}
  .ub b{display:block;font-size:13px;line-height:1.4;word-break:break-word}
  .ub .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
  .ua{margin-top:5px}
  .ua .mini:first-child{margin-left:0}
  .none{color:var(--off);font-size:12.5px;padding:6px 0}
  .cut{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nw{white-space:nowrap}
  td[data-ic]{cursor:text}
  tbody tr:hover td[data-ic]:hover{background:#eef3ff;box-shadow:inset 0 0 0 1px #cddcff}
  .icin{width:100%;min-width:90px;padding:5px 7px;border:1px solid var(--acc);border-radius:6px;
    font-family:inherit;font-size:13px;color:var(--tx);background:#fff}
  .qid{max-width:120px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;white-space:nowrap;
    background:#eef1f5;color:var(--tx2)}
  .badge.ok{background:#e7f6ee;color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:#fdeceb;color:#b42318}
  .badge.off{background:#f0f2f5;color:var(--off)}

  .calwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .calhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .calhead b{font-size:15px;min-width:104px;text-align:center}
  .legend{margin-left:auto;color:var(--off);font-size:11.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;
    vertical-align:1px;background:var(--off)}
  .dot.routine{background:var(--acc)} .dot.cert{background:#d92d20}
  .dot.alert{background:#e79a3c}      .dot.log{background:var(--ok)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cw{text-align:center;font-size:11.5px;color:var(--off);padding:2px 0}
  .cw.sun,.dn.sun{color:#c0392b}
  .cw.sat,.dn.sat{color:#1f5eff}
  .cd{min-height:60px;border:1px solid transparent;border-radius:8px;padding:4px 6px;
    cursor:pointer;overflow:hidden}
  .cd.off{cursor:default}
  .cd:hover{background:#f4f6f9}
  .cd.today .dn{color:var(--acc);font-weight:700}
  .cd.sel{background:var(--acc-bg);border-color:#cddcff}
  .dn{font-size:12px;color:var(--tx2);display:block;margin-bottom:2px}
  .ev{display:block;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;color:var(--tx2)}
  .ev::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
    margin-right:4px;vertical-align:2px;background:var(--off)}
  .ev.routine::before{background:var(--acc)} .ev.cert::before{background:#d92d20}
  .ev.alert::before{background:#e79a3c}       .ev.log::before{background:var(--ok)}
  .ev.done{color:var(--off);text-decoration:line-through}
  .strike{text-decoration:line-through;opacity:.5}
  .more{font-size:10.5px;color:var(--off);margin-left:9px}

  .quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .quick input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:13.5px;color:var(--tx);background:#fff}
  .quick input[type=text]{flex:1;min-width:220px;font-size:14px}
  .daybox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .daybox h3{margin:0 0 8px;font-size:13.5px}
  .dlist{display:flex;flex-direction:column;gap:7px}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;
    border-bottom:1px dashed var(--line);padding-bottom:7px}
  .drow:last-child{border-bottom:0;padding-bottom:0}
  .dt{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:12.5px;min-width:86px}
  .grow{flex:1}
  h2.sh{font-size:14px;margin:18px 0 8px}
  h2.sh .sub{font-weight:400}

  .modal{position:fixed;inset:0;background:rgba(15,20,28,.45);display:none;z-index:50;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal.on{display:flex}
  .mbox{background:var(--card);border-radius:12px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .mhead,.mfoot{display:flex;gap:8px;align-items:center;padding:12px 16px}
  .mhead{border-bottom:1px solid var(--line);font-size:14px}
  .mhead b{flex:1}
  .mfoot{border-top:1px solid var(--line)}
  .mbody{padding:12px 16px;max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:9px}
  .mbody label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tx2)}
  .mbody input,.mbody select,.mbody textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    font-family:inherit;font-size:13.5px;color:var(--tx);background:#fff;width:100%}
  .mbody textarea{resize:vertical}

  /* 일괄 붙여넣기 — 붙여넣은 여러 줄을 표로 펼쳐 고친 뒤 한꺼번에 등록한다 */
  .mbox.wide{width:min(1360px,100%)}
  .bwrap{padding:12px 16px}
  .bhint{margin:0 0 10px;font-size:12.5px;color:var(--tx2);line-height:1.75}
  .bhint code{background:var(--sec);padding:1px 5px;border-radius:4px;font-size:11.5px}
  #bpaste{width:100%;min-height:210px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:13px;line-height:1.65;color:var(--tx);background:#fff;resize:vertical}
  #bpaste:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
  .bscroll{max-height:54vh;overflow:auto}
  .btab{min-width:0}
  .btab th{position:sticky;top:0;z-index:1;background:#fafbfc;padding:7px 6px;cursor:default}
  .btab td{padding:3px 5px;vertical-align:middle}
  .btab input,.btab select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:12.5px;color:var(--tx);background:#fff}
  .btab input[type=checkbox]{width:auto}
  .btab tr.off td{opacity:.42}
  .btab tr.dup input:not([type=checkbox]){background:var(--warn-bg)}
  .bno{text-align:center;color:var(--tx2);font-size:11.5px;white-space:nowrap}
  .bwarn{color:var(--warn);font-size:11px}
  @media print{.tabs,.bar,.chips,.lockbar,.schedbar,.quick,.modal,footer{display:none}body{background:#fff}}
</style>
</head>

  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>

  <footer>
    제일엠앤에스 총무팀 · 모든 탭을 화면에서 바로 추가·수정·삭제할 수 있습니다 (칸을 클릭하면 그 자리에서 수정)<br>
    고친 뒤 <b>저장 — 내려받기</b> → <code>정보관리.cmd</code> 로 회수 :
    연락처 <code>contacts.json</code> [7] · 접속정보 <code>credentials.enc.json</code> [8] · 일정 <code>schedule.json</code> [5]<br>
    자세한 규칙은 <code>README.md</code>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mhead"><b id="mtitle"></b><button class="mini" id="mclose">닫기</button></div>
    <div class="mbody" id="mbody"></div>
    <div class="mfoot">
      <button class="mini" id="mdel">삭제</button>
      <span class="grow"></span>
      <button class="mini" id="mcancel">취소</button>
      <button class="mini p" id="msave">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="bulk">
  <div class="mbox wide">
    <div class="mhead"><b id="btitle"></b><button class="mini" id="bclose">닫기</button></div>
    <div class="bwrap" id="bbody"></div>
    <div class="mfoot">
      <span class="meta" id="bmeta"></span>
      <span class="grow"></span>
      <button class="mini" id="bback">다시 붙여넣기</button>
      <button class="mini" id="bcancel">취소</button>
      <button class="mini p" id="bsave">등록</button>
    </div>
  </div>
</div>

   화면에서 고친 연락처는 이 브라우저에만 임시 저장되며,
   [contacts.json 내려받기] -> 정보관리.cmd [7] 연락처 저장 을 거쳐야 원장에 들어간다.

const CONT_LS  = 'jeilm.chongmu.contacts.v1';
const GROUPS   = DATA.groups || [];
const CATS_ALL = DATA.categories || [];
let contDraft = '';
let CONTACTS = (() => {
  try{
    const raw = localStorage.getItem(CONT_LS);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.base === DATA.revision && Array.isArray(d.data)){ contDraft = d.savedAt || '저장됨'; return d.data; }
      localStorage.removeItem(CONT_LS);   /* 원장이 더 새 것이면 임시본은 버린다 */
    }
  }catch(_){}
  return JSON.parse(JSON.stringify(DATA.contacts || []));
})();

function saveContacts(){
  try{
    const at = new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    localStorage.setItem(CONT_LS, JSON.stringify({base:DATA.revision, savedAt:at, data:CONTACTS}));
    contDraft = at;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => { const u = new Uint8Array(buf); let s = '';
  for(let i=0; i<u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s); };

async function tryUnlock(){
  const pw = $('#pw').value, err = $('#err'), go = $('#go');
  if(!pw) return;
  if(!crypto?.subtle){ err.textContent = '이 브라우저에서는 복호화를 사용할 수 없습니다. Chrome/Edge로 열어주세요.'; return; }
  go.disabled = true; err.textContent = '해제 중...';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    /* 화면에서 고친 내용을 같은 비밀번호로 다시 암호화해야 하므로 encrypt 권한도 함께 받는다 */
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iterations, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt','encrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.iv)}, key, b64(VAULT.data));
    vaultData = JSON.parse(new TextDecoder().decode(pt));
    vaultKey = key;
    await restoreCredDraft();          /* 저장하지 않고 잠갔던 변경이 있으면 이어서 연다 */
    startSession();
    q=''; sortK=null; resetPanel(); draw();
  }catch(_){
    go.disabled = false; err.textContent = '비밀번호가 올바르지 않습니다.';
    $('#pw').value=''; $('#pw').focus();
  }
}
/* 잠글 때 키까지 버린다 — 임시본은 암호문 상태로 남아 다음 잠금 해제 때 복원된다 */
function lock(auto){
  if(credDraft && !auto)
    alert('저장하지 않은 접속정보 변경이 있습니다.\n암호문 상태로 이 브라우저에 남아 다음 잠금 해제 때 이어서 열리지만,\n원장에 반영하려면 [credentials.enc.json 내려받기] 와 정보관리.cmd [8] 을 실행해야 합니다.');
  vaultData=null; vaultKey=null; q=''; sortK=null; pwShown=false;
  clearTimeout(sessionTimer); sessionEnd=null; resetPanel(); draw();
}
function startSession(){
  clearTimeout(sessionTimer);
  sessionEnd = Date.now() + SESSION_MS;
  sessionTimer = setTimeout(() => {
    if(vaultData){
      const had = !!credDraft;
      lock(true);
      alert('로그인 유지시간(3시간)이 지나 접속정보를 다시 잠갔습니다.'
        + (had ? '\n저장하지 않은 변경은 암호문 상태로 남아 있어 다시 해제하면 그대로 열립니다.' : ''));
    }
  }, SESSION_MS);
}

/* --------------------------------------------------------------------------
   접속정보 임시본 — 화면에서 고친 내용은 같은 비밀번호로 곧바로 다시 암호화해
   브라우저에 보관한다(평문은 어디에도 남지 않는다).
   [credentials.enc.json 내려받기] → 정보관리.cmd [8] 접속정보 저장 을 거쳐야 원장에 들어간다.
   -------------------------------------------------------------------------- */
async function encPackage(){
  if(!vaultKey || !vaultData) return null;
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const out = {...vaultData, updatedAt:TODAY};
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM', iv}, vaultKey,
                new TextEncoder().encode(JSON.stringify(out)));
  return {
    v:1, alg:'AES-256-GCM', kdf:'PBKDF2-SHA256',
    iterations:VAULT.iterations, salt:VAULT.salt,   /* 비밀번호가 같으므로 소금·반복수는 그대로 */
    iv:b64e(iv), data:b64e(ct),
    count:(vaultData.credentials||[]).length,
    encryptedAt:new Date().toLocaleString('sv-SE').slice(0,16),
    basedOn:VAULT.encryptedAt || ''                 /* 어느 원장에서 고친 것인지 — 회수 때 대조 */
  };
}
/* 편집 직후 호출 — 표시는 바로 바꾸고, 암호화·보관은 뒤에서 마무리한다 */
function touchCreds(){
  credDraft = new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const at = credDraft;
  encPackage().then(pkg => {
    if(!pkg) return;
    try{ localStorage.setItem(CRED_LS, JSON.stringify({base:VAULT.encryptedAt, savedAt:at, pkg})); }
    catch(_){ }
  }).catch(() => {});
}
async function restoreCredDraft(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(CRED_LS) || 'null'); }catch(_){ }
  if(!d || !d.pkg){ return; }
  if(d.base !== VAULT.encryptedAt){ dropCredStore(); return; }   /* 원장이 더 새 것이면 버린다 */
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(d.pkg.iv)}, vaultKey, b64(d.pkg.data));
    vaultData = JSON.parse(new TextDecoder().decode(pt));
    credDraft = d.savedAt || '저장됨';
  }catch(_){ dropCredStore(); }                                  /* 비밀번호가 바뀌었으면 못 연다 */
}
function dropCredStore(){ try{ localStorage.removeItem(CRED_LS); }catch(_){ } credDraft = ''; }
async function dropCreds(){
  dropCredStore();
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.iv)}, vaultKey, b64(VAULT.data));
    vaultData = JSON.parse(new TextDecoder().decode(pt));
  }catch(_){ vaultData = null; vaultKey = null; }
  resetPanel(); drawTabs(); draw();
}
async function downloadCreds(){
  const pkg = await encPackage();
  if(!pkg){ alert('먼저 잠금을 해제하세요.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'}));
  a.download = 'credentials.enc.json'; a.click();
}
function credBar(){ return draftBar('v', credDraft, VAULT.encryptedAt, 'credentials.enc.json', '[8] 접속정보 저장'); }
function bindCredBar(){
  const dl = $('#vdl'); if(dl) dl.onclick = downloadCreds;
  const dp = $('#vdrop'); if(dp) dp.onclick = () => {
    if(confirm('화면에서 고친 접속정보를 모두 버리고 원장(credentials.enc.json) 상태로 되돌립니다.')) dropCreds();
  };
}

/* ==========================================================================
   🔐 인증서·도메인 · 📅 정기업무 캘린더
   원장은 data\schedule.json 하나이고, 위 SCHEDULE_DATA 블록은 그 사본이다.
   화면에서 고친 내용은 이 브라우저에만 임시 저장되며,
   [schedule.json 내려받기] → 정보관리.cmd [5] 일정 저장 을 거쳐야 원장에 반영된다.
   ========================================================================== */
const SCHED_LS = 'jeilm.chongmu.schedule.v1';
const FREQS = ['매주','매월','격월','분기','반기','매년','수시'];
const WD = ['일','월','화','수','목','금','토'];

const TODAY0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = ymd(TODAY0);
const parseD = s => { const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s??'').trim()); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const dday = s => { const d = parseD(s); return d ? Math.round((d - TODAY0)/86400000) : null; };
const ddayTxt = n => n < 0 ? `${-n}일 지남` : n === 0 ? '오늘' : `D-${n}`;
const ddayCls = n => n <= 7 ? 'bad' : n <= 30 ? 'warn' : 'ok';

/* ---------- 저장소 (원장 사본 + 브라우저 임시본) ---------- */
let schedDraft = '';
let SCHED = (() => {
  try{
    const raw = localStorage.getItem(SCHED_LS);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.base === SCHEDULE.revision && d.data){ schedDraft = d.savedAt || '저장됨'; return d.data; }
      localStorage.removeItem(SCHED_LS);   /* 원장이 더 새 것이면 임시본은 버린다 */
    }
  }catch(_){}
  return JSON.parse(JSON.stringify(SCHEDULE));
})();
['certs','routines','logs','certKinds','routineCats'].forEach(k => { if(!Array.isArray(SCHED[k])) SCHED[k] = []; });

function saveSched(){
  SCHED.updatedAt = TODAY;
  try{
    const at = new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    localStorage.setItem(SCHED_LS, JSON.stringify({base:SCHEDULE.revision, savedAt:at, data:SCHED}));
    schedDraft = at;
  }catch(_){
    schedDraft = '(브라우저 저장 실패)';
    alert('브라우저에 임시 저장하지 못했습니다. 창을 닫기 전에 [schedule.json 내려받기] 를 눌러 두세요.');
  }
}
function dropDraft(){
  localStorage.removeItem(SCHED_LS); schedDraft = '';
  SCHED = JSON.parse(JSON.stringify(SCHEDULE));
  ['certs','routines','logs','certKinds','routineCats'].forEach(k => { if(!Array.isArray(SCHED[k])) SCHED[k] = []; });
  resetPanel(); drawTabs(); draw();
}
function downloadSched(){
  const out = JSON.parse(JSON.stringify(SCHED)); out.updatedAt = TODAY;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download = 'schedule.json'; a.click();
}
function nextId(pre, arr){
  const re = new RegExp('^'+pre+'-(\\d+)$'); let n = 0;
  (arr||[]).forEach(o => { const m = re.exec(o.id||''); if(m) n = Math.max(n, +m[1]); });
  return pre + '-' + String(n+1).padStart(3,'0');
}

/* ---------- 주기 계산 ----------
   anchor: 매주=요일(월~일) · 매월=일자(1~31 또는 '말일') · 격월/분기/반기/매년='MM-DD' */
const lastDay = (y,m) => new Date(y, m, 0).getDate();
function dayNum(y, m, spec){
  const s = String(spec??'').trim(); if(!s) return 0;
  const L = lastDay(y,m);
  if(s === '말일') return L;
  const n = parseInt(s,10);
  return n >= 1 ? Math.min(n, L) : 0;
}
function occDays(r, y, m){
  if(r.state === '종료') return [];
  const a = String(r.anchor??'').trim(), out = [];
  if(r.freq === '매주'){
    const w = WD.indexOf(a); if(w < 0) return [];
    for(let d=1; d<=lastDay(y,m); d++) if(new Date(y,m-1,d).getDay() === w) out.push(d);
  } else if(r.freq === '매월'){
    const d = dayNum(y,m,a); if(d) out.push(d);
  } else {
    const step = {'격월':2,'분기':3,'반기':6,'매년':12}[r.freq];
    const mm = /^(\d{1,2})-(\d{1,2})$/.exec(a);
    if(step && mm && ((((m - (+mm[1])) % step) + step) % step) === 0){
      const d = dayNum(y,m,mm[2]); if(d) out.push(d);
    }
  }
  return out;
}
function nextDue(r){
  if(r.next && parseD(r.next)) return r.next;                 /* 직접 지정이 우선 */
  let y = TODAY0.getFullYear(), m = TODAY0.getMonth()+1;
  for(let i=0; i<26; i++){
    for(const d of occDays(r,y,m)){
      const s = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(s >= TODAY) return s;
    }
    if(++m > 12){ m = 1; y++; }
  }
  return '';
}
const isDone = (refId, due) => (SCHED.logs||[]).some(l => l.refId === refId && l.due === due);

function certState(c){
  if(c.state === '해지') return {k:'off', t:'해지'};
  const n = dday(c.expiry) ?? dday(c.contractEnd);   /* 설치본 만기 우선, 없으면 서비스(계약) 만기 */
  if(n === null)  return {k:'', t:'만료일 미확인'};
  if(n < 0)       return {k:'bad', t:`만료 ${-n}일 경과`};
  if(n <= 30)     return {k:'bad', t:ddayTxt(n)};
  if(n <= 60)     return {k:'warn', t:ddayTxt(n)};
  return {k:'ok', t:ddayTxt(n)};
}

/* ---------- 달력용 이벤트 ---------- */
function monthEvents(y, m){
  const map = {}, put = (ds, ev) => { (map[ds] = map[ds] || []).push(ev); };
  const pad = d => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  (SCHED.routines||[]).forEach(r => {
    if(r.state === '종료') return;
    const days = occDays(r,y,m).slice();
    const nx = parseD(r.next);
    if(nx && nx.getFullYear() === y && nx.getMonth()+1 === m && !days.includes(nx.getDate())) days.push(nx.getDate());
    days.sort((a,b)=>a-b).forEach(d => {
      const ds = pad(d);
      put(ds, {type:'routine', id:r.id, title:r.title, cat:r.category, owner:r.owner, due:ds, done:isDone(r.id,ds)});
    });
  });
  (SCHED.certs||[]).forEach(c => {
    if(c.state === '해지') return;
    const e = parseD(c.expiry);
    if(e){
      if(e.getFullYear() === y && e.getMonth()+1 === m) put(ymd(e), {type:'cert', id:c.id, title:`${c.name} 만료`, cat:c.kind});
      const w = new Date(e); w.setDate(w.getDate()-30);
      if(w.getFullYear() === y && w.getMonth()+1 === m) put(ymd(w), {type:'alert', id:c.id, title:`${c.name} 갱신 착수`, cat:c.kind});
    }
    const ce = parseD(c.contractEnd);
    if(ce && ce.getFullYear() === y && ce.getMonth()+1 === m && c.contractEnd !== c.expiry)
      put(ymd(ce), {type:'alert', id:c.id, title:`${c.name} 서비스(계약) 만기`, cat:c.kind});
  });
  (SCHED.logs||[]).forEach(l => {
    const d = parseD(l.date); if(!d || d.getFullYear() !== y || d.getMonth()+1 !== m) return;
    put(l.date, {type:'log', id:l.id, title:l.title, cat:l.result || '기록'});
  });
  return map;
}
function upcoming(days){
  const lim = new Date(TODAY0); lim.setDate(lim.getDate()+days);
  const out = [];
  (SCHED.routines||[]).forEach(r => {
    if(r.state === '종료') return;
    const n = nextDue(r); const d = parseD(n);
    if(d && d <= lim) out.push({date:n, type:'routine', ref:r, title:r.title, sub:r.category, done:isDone(r.id,n)});
  });
  (SCHED.certs||[]).forEach(c => {
    if(c.state === '해지') return;
    const d = parseD(c.expiry);
    if(d && d <= lim) out.push({date:c.expiry, type:'cert', ref:c, title:`${c.name} 만료`, sub:c.kind});
    const ce = parseD(c.contractEnd);
    if(ce && ce <= lim && c.contractEnd !== c.expiry)
      out.push({date:c.contractEnd, type:'cert', ref:c, title:`${c.name} 서비스(계약) 만기`, sub:c.kind});
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}

/* ---------- 공통 UI ---------- */
/* 저장 안내 띠 — 연락처·접속정보·일정이 같은 모양을 쓴다 (pre 는 버튼 id 접두어) */
function draftBar(pre, savedAt, lastAt, file, step){
  return `<div class="schedbar${savedAt?' dirty':''}">${savedAt
    ? `<b>저장하지 않은 변경</b> <span>${esc(savedAt)}</span>
       <span class="grow"></span>
       <button class="mini p" id="${pre}dl">저장 — ${esc(file)} 내려받기</button>
       <button class="mini" id="${pre}drop">되돌리기</button>
       <span>내려받은 뒤 <code>정보관리.cmd</code> ${esc(step)} 실행</span>`
    : `최종 저장 ${esc(lastAt||'-')}
       <span class="grow"></span>
       <button class="mini" id="${pre}dl">${esc(file)} 내려받기</button>`}</div>`;
}
function schedBar(){ return draftBar('s', schedDraft, SCHEDULE.updatedAt, 'schedule.json', '[5] 일정 저장'); }
function bindSchedBar(){
  const dl = $('#sdl'); if(dl) dl.onclick = downloadSched;
  const dp = $('#sdrop'); if(dp) dp.onclick = () => {
    if(confirm('브라우저에 임시 저장된 변경을 모두 버리고 원장(schedule.json) 상태로 되돌립니다.')) dropDraft();
  };
}
function chipsOf(all, keyOf){
  const ks = [];
  all.forEach(o => { const k = keyOf(o); if(!ks.includes(k)) ks.push(k); });
  if(cat !== '전체' && !ks.includes(cat)) cat = '전체';
  return `<div class="chips">
    <span class="chip${cat==='전체'?' on':''}" data-c="전체">전체<span class="n">${all.length}</span></span>
    ${ks.map(k => `<span class="chip${cat===k?' on':''}" data-c="${esc(k)}">${esc(k)}<span class="n">${all.filter(o=>keyOf(o)===k).length}</span></span>`).join('')}
  </div>`;
}
const bindChips = () => document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { cat = ch.dataset.c; draw(); });

/* ---------- 공통 — 행 버튼 · 요약카드 · 표 안에서 바로 수정 ---------- */
const rowBtns = (kind, id) => `<span class="nw">`
  + `<button class="mini" data-edit="${kind}:${esc(id)}">수정</button>`
  + `<button class="mini dgr" data-del="${kind}:${esc(id)}">삭제</button></span>`;

const statCard = (k, v, s, cls) => `<div class="stat${cls?' '+cls:''}">`
  + `<span class="k">${esc(k)}</span><b>${esc(v)}</b>`
  + `<span class="s" title="${esc(s||'')}">${esc(s||'')}</span></div>`;

/* 표의 칸을 눌러 그 자리에서 고친다 — td[data-ic="종류:ID:필드:입력형"] */
const IC_OPTS = {
  'routine:category':() => SCHED.routineCats, 'routine:freq':() => FREQS,
  'routine:state':()   => ['운영','종료'],
  'cert:kind':()       => SCHED.certKinds,    'cert:state':() => ['운영','해지'],
  'contact:category':()=> CATS_ALL,           'contact:group':() => GROUPS,
  'contact:status':()  => ['활성','보류','종료'],
  'cred:category':()   => VAULT_CATS
};
const icTd = (kind, id, key, type) =>
  ` data-ic="${kind}:${esc(id)}:${key}:${type}" title="클릭해서 바로 수정"`;
let icOn = false;
function startInline(td){
  if(icOn) return;
  const [kind, id, key, type] = td.dataset.ic.split(':');
  const arr = ARR_OF(kind), o = arr && arr.find(x => x.id === id);
  if(!o) return;
  const val = String(o[key] ?? ''), prev = td.innerHTML;
  let el;
  if(type === 'sel'){
    el = document.createElement('select');
    const opts = IC_OPTS[kind+':'+key] ? IC_OPTS[kind+':'+key]() : [];
    el.innerHTML = (opts.includes(val) ? opts : [val, ...opts])
      .map(x => `<option${x===val?' selected':''}>${esc(x)}</option>`).join('');
  } else {
    el = document.createElement('input');
    el.type = type === 'date' ? 'date' : 'text';
    el.value = val;
  }
  el.className = 'icin';
  icOn = true; td.innerHTML = ''; td.appendChild(el);
  el.focus(); if(el.select) el.select();
  const done = ok => {
    if(!icOn) return;
    icOn = false;
    const nv = el.value.trim();
    if(ok && nv !== val){ o[key] = nv; if(kind==='cred') o.updatedAt = TODAY; afterInline(kind); }
    else td.innerHTML = prev;
  };
  el.onblur = () => done(true);
  el.onkeydown = e => {
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); el.blur(); }
    else if(e.key === 'Escape'){ el.onblur = null; done(false); }
  };
  if(type === 'sel') el.onchange = () => el.blur();
}
/* 종류별 임시 저장 — 연락처·접속정보·일정이 각각 따로 보관된다 */
function saveOf(kind){
  if(kind === 'contact') saveContacts();
  else if(kind === 'cred') touchCreds();
  else saveSched();
}
const draftOf = kind => kind==='contact' ? contDraft : kind==='cred' ? credDraft : schedDraft;
/* 저장 안내 띠가 처음 뜰 때만 골격을 다시 만든다 (검색·입력칸 유지) */
function afterInline(kind){
  const wasClean = !draftOf(kind);
  saveOf(kind);
  if(wasClean) resetPanel();
  drawTabs(); draw();
}
document.addEventListener('click', e => {
  const td = e.target.closest('td[data-ic]');
  if(td && !td.querySelector('.icin')) startInline(td);
});

const tdOf = (col, r, kind) => `<td${col.ic ? icTd(kind, r.id, col.k, col.ic) : ''}>${col.r(r)}</td>`;
function tableHtml(cols, rows, kind){
  return `<div class="tablebox">
    <table><thead><tr>${cols.map(c => `<th data-k="${c.k}">${c.t}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => tdOf(c, r, kind)).join('')}</tr>`).join('')}</tbody></table>
    ${rows.length?'':'<div class="empty">항목 없음</div>'}
  </div>`;
}

/* ---------- 🔐 인증서·도메인 ---------- */
const COLS_CERT = [
  {k:'kind',   t:'구분',   ic:'sel',  r:c=>`<span class="cat">${esc(c.kind||'-')}</span>`},
  {k:'name',   t:'대상',   ic:'text', r:c=>`<span class="co">${esc(c.name)}</span>`
      + (c.services||c.target ? `<div class="sub">${esc(c.services||c.target)}</div>` : '')},
  {k:'issuer', t:'발급기관', ic:'text', r:c=>esc(c.issuer)||dash},
  {k:'expiry', t:'만료일',  ic:'date', r:c=>c.expiry?`<span class="tel">${esc(c.expiry)}</span>`:dash},
  {k:'_dd',    t:'남은기간', r:c=>{ const s=certState(c); return `<span class="badge ${s.k}">${esc(s.t)}</span>`; }},
  {k:'contractEnd', t:'서비스 만기', ic:'date', r:c=>c.contractEnd?`<span class="sub">${esc(c.contractEnd)}</span>`:dash},
  {k:'owner',  t:'담당',   ic:'text', r:c=>(esc(c.owner)||dash)+(c.account?`<div class="sub">🔒 ${esc(c.account)}</div>`:'')},
  {k:'note',   t:'메모',   ic:'text', r:c=>`<span class="sub cut" title="${esc(c.note)}">${esc(c.note)}</span>`},
  {k:'_a',     t:'',       r:c=>rowBtns('cert', c.id)}
];
function drawCert(){
  const all = SCHED.certs;
  const chips = chipsOf(all, c => c.kind||'기타');
  const rows = search(cat==='전체' ? all : all.filter(c => (c.kind||'기타')===cat));
  const cnt = {bad:0, warn:0, ok:0, '':0, off:0};
  all.forEach(c => cnt[certState(c).k]++);
  const live = all.filter(c => c.state!=='해지' && (parseD(c.expiry)||parseD(c.contractEnd)))
                  .sort((a,b)=>String(a.expiry||a.contractEnd).localeCompare(String(b.expiry||b.contractEnd)));
  const near = live[0], nd = near ? (dday(near.expiry) ?? dday(near.contractEnd)) : null;

  if(panelMode !== 'cert'){
    panelMode = 'cert';
    $('#panel').innerHTML = `
      ${schedBar()}

function overdue(days){
  const from = new Date(TODAY0); from.setDate(from.getDate()-days);
  const fromS = ymd(from), out = [];
  (SCHED.routines||[]).forEach(r => {
    if(r.state === '종료') return;
    let y = from.getFullYear(), m = from.getMonth()+1;
    for(let i=0; i<=Math.ceil(days/28)+1; i++){
      occDays(r,y,m).forEach(d => {
        const s = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(s >= fromS && s < TODAY && !isDone(r.id,s)) out.push({date:s, ref:r});
      });
      if(++m > 12){ m = 1; y++; }
    }
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
function calHtml(){

  for(let d=1; d<=L; d++){

    const list = ev[ds] || [], w = new Date(calY, calM-1, d).getDay();
    cells += `<div class="cd${ds===TODAY?' today':''}${ds===calSel?' sel':''}" data-d="${ds}">
      <span class="dn${w===0?' sun':w===6?' sat':''}">${d}</span>
      ${list.slice(0,2).map(e=>`<span class="ev ${e.type}${e.done?' done':''}" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}
      ${list.length>2?`<span class="more">+${list.length-2}</span>`:''}</div>`;
  }
  for(let i=(start+L)%7; i && i<7; i++) cells += '<div class="cd off"></div>';
  return `<div class="calhead">
      <button class="mini" id="pm">‹</button>
      <b>${calY}년 ${calM}월</b>

  '본사','지사','공장','사무실','미정','확인','문서','자재','생산','품질','연구','개발','물류','창고'];

const isName = s => /^[가-힣]{2,3}$/.test(s) && RE_SURNAME.test(s)
  && !POSITIONS.includes(s) && !NOT_NAME.includes(s) && !/(팀|부|과|실|처|점|국|반)$/.test(s);
/* 도메인처럼 생겼다고 다 주소는 아니다 — 포트·경로가 있거나 아는 최상위도메인일 때만 주소로 본다.
   (이 조건이 없으면 `Pass.word1` 같은 비밀번호가 접속대상 칸으로 들어간다) */
const RE_TLD = /\.(com|net|org|kr|io|ai|dev|app|cloud|local|lan|biz|info|edu|gov|jp|cn|us|de|uk|co|me|tv|xyz)$/i;
const isTarget = s => {
  const t = String(s).trim();
  if(/^(https?:\/\/|ftp:\/\/|\\)/i.test(t)) return true;
  if(/^\d{1,3}(\.\d{1,3}){3}(:\d+)?/.test(t)) return true;
  const m = /^([A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)+)(:\d+)?(\/.*)?$/.exec(t);
  return !!(m && (m[2] || m[3] || RE_TLD.test(m[1])));
};

/* 010 8835 5999 · +82-10-8835-5999 → 010-8835-5999 로 모양을 맞춘다 */
function fmtTel(raw){
  const s = String(raw).trim();
  let d = s.replace(/\D/g, '');
  if(s.startsWith('+')) d = d.replace(/^82/, '0');
  if(/^01[016789]\d{7,8}$/.test(d)) return d.length===11
    ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(/^02\d{7,8}$/.test(d)) return d.length===10
    ? `02-${d.slice(2,6)}-${d.slice(6)}` : `02-${d.slice(2,5)}-${d.slice(5)}`;
  if(/^0\d{9,10}$/.test(d)) return d.length===11
    ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(/^1[5-9]\d{6}$/.test(d)) return `${d.slice(0,4)}-${d.slice(4)}`;
  return s;
}
/* 010 으로 시작하면 휴대전화, 나머지는 대표번호. 자리가 차 있으면 비고로 흘린다. */
function putTel(o, raw){
  const t = fmtTel(raw);
  const s = String(raw).trim();
  let d = s.replace(/\D/g, ''); if(s.startsWith('+')) d = d.replace(/^82/, '0');
  const k = /^01[016789]/.test(d) ? 'mobile' : 'office';
  if(!o[k]){ o[k] = t; return; }
  const alt = k==='mobile' ? 'office' : 'mobile';
  if(!o[alt]){ o[alt] = t; return; }
  if(o.mobile !== t && o.office !== t) o._x.push(t);
}

/* ---------- 붙여넣은 글을 줄·칸으로 자르기 ---------- */
/* 표를 복사하면 한 줄 끝에 [수정][삭제] 글자가 따라온다 — 그것이 가장 확실한 줄 경계다. */
function bulkChunks(text, labelAware){
  const t = String(text || '').replace(/\r\n?/g, '\n').replace(/ /g, ' ');
  if(/수정\s*삭제/.test(t))     return t.split(/수정\s*삭제/);
  if(/\n[ \t]*\n/.test(t))      return t.split(/\n[ \t]*\n/);
  if(!labelAware)               return t.split('\n');
  /* 한 건을 `아이디:` `비밀번호:` 처럼 여러 줄로 적은 경우 — 라벨 줄은 바로 앞 건에 붙인다.
     (붙이지 않으면 줄마다 별개 건이 되어 비밀번호 줄이 통째로 버려진다) */
  const recs = [];
  t.split('\n').forEach(ln => {
    if(!ln.trim()) return;
    if(recs.length && RE_CRED_LBL.test(ln)) recs[recs.length - 1] += '\n' + ln;
    else recs.push(ln);
  });
  return recs;
}
/* 탭 · 줄바꿈 · 공백 두 칸 이상을 칸 경계로 본다. 빈칸 표시(-)와 버튼 글자는 버린다. */
function bulkCells(chunk){
  return String(chunk).split(/\t|\n| {2,}/)
    .map(s => s.trim().replace(/\s*복사$/, '').trim())
    .filter(s => s && s !== '-' && s !== '—' && !/^(복사|수정|삭제|보기|표시)$/.test(s));
}
/* 맨 앞의 분류 머리글("임대·건물4건")을 걷어내고 그 분류를 돌려준다 */
function takeHead(tk, list){
  let found = null;
  while(tk.length){
    const m = RE_SEC.exec(tk[0]); if(!m) break;
    const s = m[1].trim();
    if(list.includes(s)) found = s;
    else if(s !== '전체') break;
    tk = tk.slice(1);
  }
  return {tk, cat:found};
}

/* ---------- 연락처 ---------- */
/* 분류만 알면 대분류는 원장에서 쓰던 짝을 그대로 따라간다 */
const GROUP_OF_CAT = (() => {
  const m = {};
  (DATA.contacts || []).forEach(c => { if(c.category && !m[c.category]) m[c.category] = c.group; });
  return m;
})();
const telKey = s => String(s || '').replace(/\D/g, '');

function parseContactRow(tk, ctxCat){
  const o = {group:'', category:ctxCat || '', company:'', person:'', position:'',
             mobile:'', office:'', email:'', scope:'', note:'', _x:[]};
  const rest = [];
  tk.forEach(raw => {
    let s = String(raw);
    /* 칸 안에 섞여 있는 메일·번호를 먼저 뽑아낸다 */
    s = s.replace(RE_MAIL, m => { o.email = o.email ? o.email + ' / ' + m : m; return ' '; });
    s = s.replace(RE_TEL,  m => { putTel(o, m); return ' '; });
    s = s.replace(/\s{2,}/g, ' ').trim().replace(/^[\-—·,\/]+|[\-—·,\/]+$/g, '').trim();
    if(!s) return;
    if(!o.company && CATS_ALL.includes(s)){ o.category = s; return; }
    if(!o.company && GROUPS.includes(s)){   o.group = s;    return; }
    if(!o.company){ o.company = s; return; }
    /* "송인덕 이사" 처럼 이름과 직위가 한 칸에 있으면 나눈다 */
    const np = /^([가-힣]{2,3})\s+([가-힣]{1,6})$/.exec(s);
    if(np && !o.person && isName(np[1]) && POSITIONS.includes(np[2])){
      o.person = np[1]; o.position = np[2]; return;
    }
    if(!o.position && POSITIONS.includes(s)){ o.position = s; return; }
    if(!o.person && isName(s)){ o.person = s; return; }
    rest.push(s);
  });
  o.scope = rest.shift() || '';
  o.note  = [rest.join(' · '), ...o._x].filter(Boolean).join(' · ');
  delete o._x;
  return o;
}
function dupContact(o){
  return CONTACTS.find(c =>
    (o.mobile && telKey(c.mobile) === telKey(o.mobile)) ||
    (o.company && o.person && c.company === o.company && c.person === o.person) ||
    (o.company && !o.person && !c.person && c.company === o.company));
}
function parseContacts(text){
  const out = [];
  let ctxCat = (cat !== '전체' && CATS_ALL.includes(cat)) ? cat : '';
  bulkChunks(text).forEach(chunk => {
    const h = takeHead(bulkCells(chunk), CATS_ALL);
    if(h.cat) ctxCat = h.cat;
    if(!h.tk.length) return;
    const o = parseContactRow(h.tk, ctxCat);
    if(!o.company && !o.person && !o.mobile && !o.office && !o.email) return;
    o.group = o.group || GROUP_OF_CAT[o.category] || (GROUPS.includes(active) ? active : GROUPS[0]);
    o._dup = !!dupContact(o); o._on = !o._dup;
    out.push(o);
  });
  return out;
}

/* ---------- 접속정보 ---------- */
/* 분류 자동판정 — tools\Vault.ps1 의 Get-CredCategory 와 같은 기준 */
const CRED_CAT_RULES = [
  ['문서중앙화',      /문서중앙|클라우디움|cloudium|사이버다임|cyberdigm|doc\.jeilm|jeilmn_hq|jeilmn_dr/i],
  ['공공·지원사업',   /스마트공장|smart-factory|테크노파크|gtp\.or\.kr|nextcampus|cloudsup|클라우드지원|상생누리|winwinnuri|기술보호|울타리|ultari|중소벤처|smes\.go|정부24|기업마당|bizinfo|나라장터|g2b|홈택스|hometax|지원사업|진흥원|\.go\.kr|\.or\.kr/i],
  ['방화벽·네트워크', /방화벽|axgate|secui|bluemax|firewall|무선|wifi|wi-fi|ruckus|aruba|unleashed|스위치|switch|공유기|ap\b|vpn|4433|기가오피스|b2bcare|전용회선|회선/i],
  ['업무시스템',      /erp|그룹웨어|onulware|onul|비젠트로|세콤|secom|smart\s*a|스마트에이|더존|plm|생산|회계|근태|급여|전자세금|바로빌|쿠콘|ecount|이카운트|모두사인|modusign|전자계약/i],
  ['서버·인프라',     /서버|server|rdp|원격|백업|backup|veeam|sql|database|\bdb\b|nas|스토리지|ncloud|네이버\s*클라우드|aws|azure|mccs|172\.|192\.168\.|222\.122|1\.214\.|59\.6\./i],
  ['홈페이지·도메인', /도메인|아이네임즈|inames|호스팅|카페24|cafe24|홈페이지|웹사이트|website|www\.|dns|ssl|인증서/i],
  ['메일·협업',       /office\s*365|o365|microsoft|outlook|teams|메일|mail|gmail|google|네이버|naver|카카오|kakao|슬랙|slack|zoom/i]
];
const credCat = o => (CRED_CAT_RULES.find(r => r[1].test(`${o.system} ${o.target} ${o.info}`)) || ['기타'])[0];

/* 라벨 표기 — 칸 하나가 통째로 "라벨 : 값" 이면 그 값을 그 칸으로 본다 */
const CRED_LBL = {
  account : '아이디|계정|ID|USERNAME|USER\\s*ID|USERID|USER|사용자|로그인|LOGIN|ACCOUNT',
  password: '비밀번호|비밀\\s*번호|비번|암호|패스워드|PW|PWD|P\\s*\\/\\s*W|PASS|PASSWORD',
  target  : '주소|접속대상|접속|URL|링크|호스트|서버|HOST|SERVER',
  system  : '시스템|이름|명칭|SYSTEM|NAME',
  info    : '비고|메모|참고|설명|NOTE|MEMO'
};
const CRED_KEYS = ['account', 'password', 'target', 'system'];
const CRED_RE   = {};
Object.keys(CRED_LBL).forEach(k => {
  CRED_RE[k] = new RegExp('^\\s*(?:' + CRED_LBL[k] + ')\\s*[:=：]\\s*(.+)$', 'i');
});
const CRED_ALL    = Object.keys(CRED_LBL).map(k => CRED_LBL[k]).join('|');
const RE_CRED_LBL = new RegExp('^\\s*(?:' + CRED_ALL + ')\\s*[:=：]', 'i');
/* "아이디: a · 비밀번호: b" 처럼 한 줄에 여러 라벨이 붙어 있으면 나눈다.
   뒤에 라벨이 따라올 때만 자르므로 `방화벽·네트워크` 같은 분류명은 쪼개지지 않는다. */
const RE_CRED_SPLIT = new RegExp('\\s*[·,;|]\\s*(?=(?:' + CRED_ALL + ')\\s*[:=：])', 'i');

/* 표 머리글 행 — 함께 복사돼 들어오면 걷어낸다 */
const CRED_HEAD = ['분류', '시스템', '접속대상', '아이디', '비밀번호', '비고'];
const isCredHeadRow = ln => {
  const c = String(ln).split('\t').map(x => x.trim()).filter(Boolean);
  return c.length >= 3 && c.every(x => CRED_HEAD.includes(x));
};
/* 표에서 복사한 칸 하나를 다듬는다 — [복사] 버튼 글자와 빈칸 표시(-)를 없애되 **자리는 지킨다** */
const credSlot = s => String(s).replace(/\s*복사\s*$/, '').trim().replace(/^[-—]$/, '');

function parseCredRow(tk, ctxCat){
  const o = {category:ctxCat || '', system:'', target:'', account:'', password:'', info:''};
  const rest = [];
  tk.forEach(raw => {
    const s = String(raw).trim(); if(!s) return;
    let m, hit = false;
    for(const k of CRED_KEYS){
      m = CRED_RE[k].exec(s); if(!m) continue;
      const v = m[1].trim();
      if(!o[k]) o[k] = v; else rest.push(v);   /* 같은 라벨이 또 나오면 버리지 말고 비고로 */
      hit = true; break;
    }
    if(hit) return;
    if((m = CRED_RE.info.exec(s))){ rest.push(m[1].trim()); return; }
    if(!o.system && !o.target && VAULT_CATS.includes(s)){ o.category = s; return; }
    /* "admin / abc123" 처럼 아이디와 비밀번호를 슬래시로 붙여 쓴 경우 */
    if(!o.account && !o.password && !isTarget(s) && (m = /^(\S+)\s*\/\s*(\S+)$/.exec(s))){
      o.account = m[1]; o.password = m[2]; return;
    }
    if(!o.target && isTarget(s)){ o.target = s; return; }
    if(!o.system){ o.system = s; return; }
    rest.push(s);
  });
  if(!o.account  && rest.length) o.account  = rest.shift();
  if(!o.password && rest.length) o.password = rest.shift();
  o.info = rest.join(' · ');
  if(!o.category) o.category = credCat(o);
  return o;
}

/* 한 건(chunk)을 읽는다. 표에서 복사한 줄이면 칸 자리를 그대로 믿고, 그 밖에는 추론한다. */
function parseCredChunk(chunk, ctx){
  const body = [];
  String(chunk).split('\n').forEach(ln => {
    if(!ln.trim()) return;
    const m = RE_SEC.exec(ln.trim());                     /* 분류 머리글 "업무시스템2건" */
    if(m){ const c = m[1].trim(); if(VAULT_CATS.includes(c)) ctx.cat = c; return; }
    if(isCredHeadRow(ln)) return;                         /* 표 머리글 행 */
    body.push(ln);
  });
  if(!body.length) return null;

  /* 표에서 복사한 한 줄 — 빈 칸이 있어도 뒤 칸이 밀리지 않도록 위치를 그대로 쓴다.
     가려진 비밀번호는 클립보드에 담기지 않아 그 칸이 비는데, 자리를 지켜야
     비고 값이 비밀번호 칸으로 잘못 들어가지 않는다. */
  if(body.length === 1 && body[0].indexOf('\t') >= 0){
    const v = body[0].split('\t').map(credSlot);
    if(v.length && v[v.length - 1] === '') v.pop();       /* [수정][삭제] 칸의 빈 자리 */
    const withCat = v.length === 6 && (!v[0] || VAULT_CATS.includes(v[0]));
    if(withCat || v.length === 5){
      const c = withCat ? v : [''].concat(v);
      const o = {category:c[0] || ctx.cat || '', system:c[1], target:c[2],
                 account:c[3], password:c[4], info:c[5] || ''};
      if(!o.category) o.category = credCat(o);
      return o;
    }
  }

  /* 그 밖 — 라벨 줄은 통째로 넘기고(칸 자르기가 비밀번호 안의 공백을 쪼개지 않게),
     나머지 줄만 칸으로 잘라 추론한다. */
  const tk = [];
  body.forEach(ln => {
    if(RE_CRED_LBL.test(ln)){
      ln.split(RE_CRED_SPLIT).forEach(p => { if(p.trim()) tk.push(p.trim()); });
    } else {
      bulkCells(ln).forEach(c => tk.push(c));
    }
  });
  const h = takeHead(tk, VAULT_CATS);
  if(h.cat) ctx.cat = h.cat;
  if(!h.tk.length) return null;
  return parseCredRow(h.tk, ctx.cat);
}

function parseCreds(text){
  const out = [];
  const have = (vaultData && vaultData.credentials) || [];
  const ctx = {cat:(cat !== '전체' && VAULT_CATS.includes(cat)) ? cat : ''};
  bulkChunks(text, true).forEach(chunk => {
    const o = parseCredChunk(chunk, ctx);
    if(!o) return;
    if(!o.system && !o.target && !o.account && !o.password) return;
    o._dup = !!have.find(c => o.system && c.system === o.system
                              && (!o.account || !c.account || c.account === o.account));
    o._on = !o._dup;
    out.push(o);
  });
  return out;
}

      + '분류 머리글(<code>임대·건물4건</code>)이 섞여 있으면 그 아래 줄들의 분류로 자동 적용하고, 대분류는 분류에 맞춰 채웁니다.'
    : '표에서 복사한 줄이나 한 줄에 하나씩 적은 <code>아이디: xxx</code> 형태의 글을 붙여넣으면'
      + ' 시스템·접속대상·아이디·비밀번호를 나눠 담고 분류도 자동 판정합니다.'
      + ' 주소(<code>https://</code> · <code>172.10.x.x:3389</code>)는 접속대상으로 알아봅니다.<br>'
      + '<b class="bwarn">표에서 복사할 때 가려진 비밀번호는 클립보드에 담기지 않습니다</b> —'
      + ' 비밀번호까지 함께 옮기려면 🔒 화면에서 <b>[비밀번호 모두 표시]</b> 를 먼저 누르고 복사하세요.'
      + ' (그대로 두고 수정 화면에서 직접 입력해도 됩니다)<br>'
      + '여러 건을 한 번에 넣을 때는 <b>건과 건 사이를 빈 줄</b>로 띄우면 확실합니다.';
  $('#bbody').innerHTML = `
    <p class="bhint">${hint}<br>
      붙여넣는 즉시 아래 <b>수정 화면</b>으로 넘어갑니다 — 자동으로 채운 값은 거기서 고칠 수 있습니다.</p>
    <textarea id="bpaste" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>`;
  const ta = $('#bpaste'); ta.focus();
  ta.addEventListener('paste', () => setTimeout(() => bulkRead(ta.value), 0));
}

function bulkRead(text){
  const rows = bulkCtx.kind === 'contact' ? parseContacts(text) : parseCreds(text);
  if(!rows.length){ alert('읽어들일 내용을 찾지 못했습니다.\n붙여넣은 글을 확인해 주세요.'); return; }
  bulkCtx.rows = rows;
  bulkGrid();
}

function bulkGrid(){
  const kind = bulkCtx.kind, cols = B_COLS[kind], rows = bulkCtx.rows;
  $('#bback').style.display = '';
  let warn = '';
  if(kind === 'cred'){
    warn = '<br><b class="bwarn">비밀번호가 화면에 그대로 보입니다 — 주변을 확인하세요.</b>';
    const noPw = rows.filter(r => !String(r.password || '').trim()).length;
    if(noPw) warn += `<br><b class="bwarn">비밀번호가 비어 있는 줄 ${noPw}건</b> — 표에서 복사할 때`
      + ' 가려진 비밀번호는 클립보드에 담기지 않습니다. 🔒 화면에서 <b>[비밀번호 모두 표시]</b> 를 누르고'
      + ' 다시 복사하거나, 여기서 직접 입력하세요.';
  }
  $('#bbody').innerHTML = `
    <p class="bhint">자동으로 나눠 담은 결과입니다. 잘못 들어간 칸은 여기서 바로 고치고,
      넣지 않을 줄은 맨 앞 체크를 해제하거나 <b>×</b> 로 지우세요.
      이미 있는 것으로 보이는 줄은 <span class="bwarn">중복?</span> 표시와 함께 체크를 풀어 두었습니다.${warn}</p>
    <div class="tablebox bscroll">
      <table class="btab"><thead><tr>
        <th style="width:34px"><input type="checkbox" id="ball"${rows.every(r => r._on) ? ' checked' : ''}></th>
        <th style="width:32px">#</th>
        ${cols.map(c => `<th style="min-width:${c.w}">${esc(c.t)}</th>`).join('')}
        <th style="width:34px"></th>
      </tr></thead>
      <tbody>${rows.map((r, i) => bulkRowHtml(r, i, cols)).join('')}</tbody></table>
    </div>`;
  $('#bbody').oninput = bulkEdit;
  $('#bbody').onclick = e => {
    const rm = e.target.closest('[data-brm]');
    if(!rm) return;
    bulkCtx.rows.splice(+rm.dataset.brm, 1);
    if(!bulkCtx.rows.length){ bulkPaste(); return; }
    bulkGrid();
  };
  bulkMeta();
}
function bulkRowHtml(r, i, cols){
  return `<tr data-i="${i}" class="${r._on ? '' : 'off'}${r._dup ? ' dup' : ''}">
    <td class="bno"><input type="checkbox" data-on="${i}"${r._on ? ' checked' : ''}></td>
    <td class="bno">${i + 1}${r._dup ? '<div class="bwarn">중복?</div>' : ''}</td>
    ${cols.map(c => `<td>${
      c.type === 'sel'
        ? `<select data-b="${i}:${c.k}">${['', ...c.opt()].map(x =>
            `<option${x === (r[c.k] || '') ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`
        : `<input data-b="${i}:${c.k}" value="${esc(r[c.k] || '')}">`
    }</td>`).join('')}
    <td class="bno"><button class="mini dgr" data-brm="${i}" title="이 줄 빼기">×</button></td>
  </tr>`;
}
function bulkEdit(e){
  const el = e.target;
  if(el.dataset.b){
    const i = el.dataset.b.indexOf(':');
    bulkCtx.rows[+el.dataset.b.slice(0, i)][el.dataset.b.slice(i + 1)] = el.value;
    return;
  }
  if(el.dataset.on !== undefined){
    bulkCtx.rows[+el.dataset.on]._on = el.checked;
    el.closest('tr').classList.toggle('off', !el.checked);
    bulkMeta(); return;
  }
  if(el.id === 'ball'){
    bulkCtx.rows.forEach(r => r._on = el.checked);
    bulkGrid();
  }
}
function bulkMeta(){
  const rows = bulkCtx.rows;
  const n = rows.filter(r => r._on).length;
  const d = rows.filter(r => r._dup).length;
  $('#bmeta').textContent = `${rows.length}줄 읽음 · ${n}건 선택` + (d ? ` · 중복 의심 ${d}건` : '');
  $('#bsave').textContent = `${n}건 등록`;
}

function bulkApply(){
  if(!bulkCtx) return;
  if(!bulkCtx.rows){ const ta = $('#bpaste'); bulkRead(ta ? ta.value : ''); return; }
  const kind = bulkCtx.kind, arr = ARR_OF(kind);
  if(!arr){ alert('대상 원장을 찾지 못했습니다.'); return; }
  const use = bulkCtx.rows.filter(r => r._on);
  if(!use.length){ alert('등록할 줄이 없습니다.'); return; }
  const key = kind === 'contact' ? 'company' : 'system';
  if(use.some(r => !String(r[key] || '').trim())){
    alert(`'${kind === 'contact' ? '업체·기관' : '시스템'}' 이(가) 비어 있는 줄이 있습니다. 채운 뒤 다시 눌러 주세요.`);
    return;
  }
  const file = kind === 'contact' ? 'contacts.json' : 'credentials.enc.json';
  const step = kind === 'contact' ? '[7] 연락처 저장' : '[8] 접속정보 저장';
  if(!confirm(`${use.length}건을 ${NAME_OF[kind]} 대장에 등록합니다. 계속할까요?`)) return;
  use.forEach(r => {
    const o = {};
    B_COLS[kind].forEach(c => o[c.k] = String(r[c.k] || '').trim());
    const n = {id:nextId(PRE_OF[kind], arr), ...o};
    if(kind === 'contact'){
      n.source = '일괄붙여넣기'; n.srcId = ''; n.lastContact = '';
      n.registeredAt = TODAY;   n.status = '활성';
    } else {
      n.updatedAt = TODAY;
    }
    arr.push(n);
  });
  const wasClean = !draftOf(kind);
  saveOf(kind);
  closeBulk();
  if(wasClean) resetPanel();
  drawTabs(); draw();
  alert(`${use.length}건을 등록했습니다.\n\n아직 이 브라우저에만 임시 저장된 상태입니다.\n`
      + `표 위의 [${file} 내려받기] 를 누른 뒤 정보관리.cmd ${step} 로 회수해야 원장에 들어갑니다.`);
}

$('#bsave').onclick   = bulkApply;
$('#bback').onclick   = () => bulkPaste();
$('#bclose').onclick  = closeBulk;
$('#bcancel').onclick = closeBulk;
$('#bulk').onclick    = e => { if(e.target.id === 'bulk') closeBulk(); };


function openForm(kind, item, preset){
  const o = item ? {...item} : {...(preset||{})};
  formCtx = {kind, id:item ? item.id : null};
  $('#mtitle').textContent = `${NAME_OF[kind]} ${item?'수정':'추가'}${item?` — ${item.id}`:''}`;
  $('#mbody').innerHTML = F_OF(kind).map(f => {
    const v = esc(o[f.k] ?? '');
    let ctl;
    if(f.type === 'sel'){
      const opts = f.opt(), cur = o[f.k] ?? opts[0];
      ctl = `<select data-f="${f.k}">${opts.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
    } else if(f.type === 'ta'){
      ctl = `<textarea data-f="${f.k}" rows="2">${v}</textarea>`;
    } else {
      ctl = `<input type="${f.type==='date'?'date':'text'}" data-f="${f.k}" value="${v}" placeholder="${esc(f.ph||'')}">`;
    }
    return `<label><span>${esc(f.t)}${f.req?' *':''}</span>${ctl}</label>`;
  }).join('');
  $('#mdel').style.display = item ? '' : 'none';
  $('#modal').classList.add('on');
  const first = $('#mbody [data-f]'); if(first) first.focus();
}
function closeForm(){ $('#modal').classList.remove('on'); formCtx = null; }
function afterEdit(kind){
  const wasClean = !draftOf(kind);
  saveOf(kind); closeForm();
  if(wasClean) resetPanel();
  drawTabs(); draw();
}
function submitForm(){
  if(!formCtx) return;
  const kind = formCtx.kind;
  const o = {};
  document.querySelectorAll('#mbody [data-f]').forEach(el => o[el.dataset.f] = el.value.trim());
  for(const f of F_OF(kind)) if(f.req && !o[f.k]){ alert(`'${f.t}' 은(는) 반드시 입력해야 합니다.`); return; }
  const arr = ARR_OF(kind);
  if(!arr){ alert('대상 원장을 찾지 못했습니다.'); return; }
  if(kind === 'contact' && !o.mobile && !o.office && !o.email
     && !confirm('연락수단(휴대전화·대표번호·이메일)이 하나도 없습니다. 그대로 등록할까요?')) return;
  if(kind === 'cred') o.updatedAt = TODAY;
  if(formCtx.id){
    const i = arr.findIndex(x => x.id === formCtx.id);
    if(i < 0){ alert('대상을 찾지 못했습니다.'); return; }
    arr[i] = {...arr[i], ...o};
  } else {
    const n = {id:nextId(PRE_OF[kind], arr), ...o};
    if(kind === 'contact'){ n.srcId = ''; n.registeredAt = TODAY; }
    arr.push(n);
  }
  afterEdit(kind);
}
function delItem(kind, id){
  const arr = ARR_OF(kind); if(!arr) return;
  const i = arr.findIndex(x => x.id === id); if(i < 0) return;
  const o = arr[i], label = o.name || o.title || o.company || o.system || o.date || '';
  const st = {cert:'해지', routine:'종료', contact:'종료'}[kind];
  const tail = st
    ? `\n\n계약·거래가 끝난 건이라면 삭제보다 상태를 ${st} 로 바꾸는 편이 이력 관리에 낫습니다.`
    : '';
  if(!confirm(`[${o.id}] ${label}\n\n이 항목을 ${NAME_OF[kind]} 대장에서 삭제합니다. 계속할까요?${tail}`)) return;
  arr.splice(i,1);
  const wasClean = !draftOf(kind);
  saveOf(kind);
  if(formCtx) closeForm();
  if(wasClean) resetPanel();
  drawTabs(); draw();
}
function delForm(){ if(formCtx && formCtx.id) delItem(formCtx.kind, formCtx.id); }
function markDone(refId, due, title){
  SCHED.logs.push({id:nextId('L', SCHED.logs), date:TODAY, title, result:'완료', refId, due, note:''});
  afterEdit('log');
}
$('#msave').onclick = submitForm;
$('#mdel').onclick = delForm;
$('#mclose').onclick = closeForm;
$('#mcancel').onclick = closeForm;
$('#modal').onclick = e => { if(e.target.id === 'modal') closeForm(); };
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(bulkCtx) closeBulk(); else if(formCtx) closeForm();
});
document.addEventListener('click', e => {
  const dl = e.target.closest('[data-del]');
  if(dl){
    const i = dl.dataset.del.indexOf(':');
    delItem(dl.dataset.del.slice(0,i), dl.dataset.del.slice(i+1));
    return;
  }
  const ed = e.target.closest('[data-edit]');
  if(ed){
    const i = ed.dataset.edit.indexOf(':');
    const kind = ed.dataset.edit.slice(0,i), id = ed.dataset.edit.slice(i+1);
    const arr = ARR_OF(kind); if(!arr) return;
    const it = arr.find(x => x.id === id);
    if(it) openForm(kind, it);
    return;
  }
  const dn = e.target.closest('[data-done]');
  if(dn){ const [id, due, ...rest] = dn.dataset.done.split('|'); markDone(id, due, rest.join('|')); }
});
window.addEventListener('beforeunload', e => {
  if(schedDraft || contDraft || credDraft){ e.preventDefault(); e.returnValue = ''; }
});

drawTabs(); draw();
</script>
</body>
</html>
